[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reclaimweave"
version = "0.1.0"
description = "Reclaim — The Agent Companion Layer. WHOOP for the life around agent work: anti-attention handoff, biometric-guided step-away redirects, social free-now presence, and honest reclaimed-life ledger."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Raja Tarun" }]
keywords = [
  "ai-agents",
  "wellbeing",
  "whoop",
  "anti-attention",
  "local-first",
  "companion",
  "weave",
]
dependencies = []

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
reclaim = "reclaimweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reclaimweave = ["ui/*.html"]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S311", "S104", "S310", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
