name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (composed)
        run: python -m pytest -q
      - name: Test (stdlib core only — zero-dep verification)
        run: |
          python -c "
          import sys, pytest
          sys.modules['fastapi'] = None
          sys.modules['uvicorn'] = None
          raise SystemExit(pytest.main(['-q', 'tests/test_core_loop.py', 'tests/test_whoop_v2.py', 'tests/test_adapters_and_privacy.py']))
          "
